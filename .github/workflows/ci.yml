name: CareerTrack CI/CD Pipeline

on:
  push:
    branches: [main, develop, fix/*]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Build & Tests (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: |
          cd backend
          mvn -B clean verify

      - name: Generate JaCoCo Code Coverage Report
        if: always()
        run: |
          cd backend
          mvn jacoco:report || true

      - name: Upload Test Reports and JaCoCo Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco

  frontend-build:
    name: Frontend Build & Lint (React Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Linter
        run: |
          cd frontend
          npm run lint

      - name: Check TypeScript & Build
        run: |
          cd frontend
          npm run build
