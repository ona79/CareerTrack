openapi: 3.0.1
info:
  title: CareerTrack API - Plateforme RH
  description: |-
    API REST de gestion des carrières pour PME sénégalaise (Teranga Tech PME SARL (démo))
    - Authentification JWT multi-rôles (DRH, MANAGER, EMPLOYE, DIRECTION)
    - Conforme au Code du Travail sénégalais et calculs en Francs CFA (XOF)
    - Gestion complète du cycle RH : dossier, congés, évaluations, formation, paie, recrutement
  contact:
    name: Équipe Projet CareerTrack
    email: contact@careertrack.sn
  license:
    name: Projet Universitaire - Licence Académique
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Environnement Local Développement
- url: /
  description: Serveur Actuel
security:
- BearerAuth: []
tags:
- name: Employés
  description: "Gestion des dossiers collaborateurs, contrats et fiches de poste"
- name: Évaluations & Performance
  description: "Campagnes annuelles, objectifs SMART et entretiens N+1"
- name: Paramètres de l'Entreprise
  description: "Règles réglementaires, taux de cotisations et plafonds légaux"
- name: Authentification
  description: "Endpoints d'authentification JWT, gestion de session et profil"
- name: Notifications
  description: Alertes in-app et notifications par courrier électronique
- name: Organigramme
  description: Visualisation hiérarchique de l'entreprise et relations managers/subordonnés
- name: Documents & PDF
  description: "Génération de documents PDF officiels (Attestations, Bulletins de\
    \ paie, Contrats)"
- name: Congés & Absences
  description: "Gestion des demandes de congés, soldes et calendrier d'équipe"
- name: Promotions & Carrières
  description: "Propositions de promotion interne, revalorisations et simulations\
    \ salariales"
- name: Paie & Salaires
  description: Gestion des bulletins de salaire et cotisations IPRES/CSS
- name: Formations
  description: Catalogue des compétences et sessions de formation continue
- name: Recrutement
  description: Pipeline Kanban des candidatures et offres d'emploi
paths:
  /api/v1/settings/{key}:
    put:
      tags:
      - Paramètres de l'Entreprise
      summary: Mettre à jour la valeur d'un paramètre d'entreprise
      description: Réservé à la DRH
      operationId: updateSetting
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: value
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCompanySettingDto"
  /api/v1/leaves/{id}/validate:
    put:
      tags:
      - Congés & Absences
      summary: Valider ou refuser un congé
      description: Validation N+1 ou DRH avec décompte automatique du solde
      operationId: validateLeave
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveApprovalDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseLeaveRequestResponseDto"
      security:
      - BearerAuth: []
  /api/v1/employees/{id}:
    get:
      tags:
      - Employés
      summary: Détails d'un employé
      description: Retourne le dossier complet d'un collaborateur par son ID
      operationId: getEmployeeById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEmployeeResponseDto"
      security:
      - BearerAuth: []
    put:
      tags:
      - Employés
      summary: Mettre à jour un employé
      description: Modifie les informations administratives d'un employé
      operationId: updateEmployee
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeCreateDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEmployeeResponseDto"
      security:
      - BearerAuth: []
    delete:
      tags:
      - Employés
      summary: Supprimer un employé
      description: Supprime un dossier collaborateur
      operationId: deleteEmployee
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
      security:
      - BearerAuth: []
  /api/v1/trainings:
    get:
      tags:
      - Formations
      summary: Consulter le catalogue de formation
      description: Accessible à l'ensemble des collaborateurs
      operationId: getAllTrainings
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListTrainingDto"
    post:
      tags:
      - Formations
      summary: Ajouter un nouveau module de formation au catalogue
      description: Réservé à la DRH
      operationId: createTraining
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTrainingDto"
  /api/v1/promotions:
    get:
      tags:
      - Promotions & Carrières
      summary: Lister les propositions de promotion
      description: Accessible à la DRH et aux managers
      operationId: getAllProposals
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListPromotionProposalDto"
    post:
      tags:
      - Promotions & Carrières
      summary: Soumettre une proposition de promotion ou revalorisation
      description: Accessible au manager N+1 ou à la DRH
      operationId: createProposal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionProposalDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePromotionProposalDto"
  /api/v1/payroll/generate:
    post:
      tags:
      - Paie & Salaires
      summary: Générer la paie mensuelle globale pour tous les salariés
      description: Calcul automatique des retenues IPRES et charges CSS
      operationId: generatePayroll
      parameters:
      - name: period
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListPayslipResponseDto"
  /api/v1/leaves:
    get:
      tags:
      - Congés & Absences
      summary: Lister toutes les demandes de congés
      description: Retourne l'ensemble des demandes de congés de l'entreprise
      operationId: getAllLeaves
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListLeaveRequestResponseDto"
      security:
      - BearerAuth: []
    post:
      tags:
      - Congés & Absences
      summary: Soumettre une demande de congé
      description: Crée une nouvelle demande de congé avec vérification du solde
      operationId: createLeaveRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveRequestCreateDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseLeaveRequestResponseDto"
      security:
      - BearerAuth: []
  /api/v1/evaluations/campaigns:
    get:
      tags:
      - Évaluations & Performance
      summary: Lister les campagnes d'évaluations
      description: Accessible à tous les collaborateurs connectés
      operationId: getCampaigns
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListEvaluationCampaignDto"
    post:
      tags:
      - Évaluations & Performance
      summary: Lancer une nouvelle campagne annuelle d'évaluation
      description: Réservé à la DRH
      operationId: createCampaign
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationCampaignDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEvaluationCampaignDto"
  /api/v1/employees:
    get:
      tags:
      - Employés
      summary: Liste paginée des employés
      description: Récupère les employés avec pagination et tri (DRH et Managers)
      operationId: getAllEmployees
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
          default: lastName
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePageResponseEmployeeResponseDto"
      security:
      - BearerAuth: []
    post:
      tags:
      - Employés
      summary: Créer un employé
      description: Enregistre un nouveau collaborateur dans la plateforme
      operationId: createEmployee
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeCreateDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEmployeeResponseDto"
      security:
      - BearerAuth: []
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentification
      summary: Rafraîchir le token d'accès
      description: Génère un nouvel Access Token à partir d'un Refresh Token valide
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseJwtResponse"
  /api/v1/auth/logout:
    post:
      tags:
      - Authentification
      summary: Déconnexion
      description: Invalide le Refresh Token de session
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/v1/auth/login:
    post:
      tags:
      - Authentification
      summary: Connexion utilisateur
      description: Authentifie l'utilisateur et retourne un Access Token (15m) et
        un Refresh Token (7j)
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseJwtResponse"
  /api/v1/recruitment/applications/{id}/status:
    patch:
      tags:
      - Recrutement
      summary: Déplacer une candidature (Kanban glisser-déposer)
      description: Met à jour l'étape du pipeline et déclenche une notification e-mail
      operationId: updateStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: true
        schema:
          type: string
          enum:
          - RECU
          - PRESELECTIONNE
          - ENTRETIEN
          - OFFRE
          - EMBAUCHE
          - REFUSE
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseJobApplicationDto"
  /api/v1/promotions/{id}/status:
    patch:
      tags:
      - Promotions & Carrières
      summary: Valider ou refuser une proposition de promotion
      description: Réservé à la DRH uniquement
      operationId: updateStatus_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: true
        schema:
          type: string
          enum:
          - SUBMITTED
          - UNDER_REVIEW
          - APPROVED
          - REJECTED
      - name: comment
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePromotionProposalDto"
  /api/v1/payroll/payslips/{id}/status:
    patch:
      tags:
      - Paie & Salaires
      summary: "Modifier le statut d'un bulletin de paie (DRAFT, VALIDATED, PAID)"
      description: Réservé à la DRH
      operationId: updateStatus_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: true
        schema:
          type: string
          enum:
          - DRAFT
          - GENERATED
          - PAID
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePayslipResponseDto"
  /api/v1/notifications/{id}/read:
    patch:
      tags:
      - Notifications
      summary: Marquer une notification comme lue
      description: Accessible à l'utilisateur connecté
      operationId: markAsRead
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/v1/trainings/{id}:
    get:
      tags:
      - Formations
      summary: Obtenir le détail d'un module de formation
      description: Accessible à l'ensemble des collaborateurs
      operationId: getTrainingById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTrainingDto"
  /api/v1/settings:
    get:
      tags:
      - Paramètres de l'Entreprise
      summary: Lister les paramètres réglementaires de l'entreprise
      description: Accessible à la DRH et Direction
      operationId: getAllSettings
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListCompanySettingDto"
  /api/v1/recruitment/offers:
    get:
      tags:
      - Recrutement
      summary: Lister les offres d'emploi publiées
      description: Accessible aux utilisateurs authentifiés
      operationId: getOffers
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListJobOffer"
  /api/v1/recruitment/applications:
    get:
      tags:
      - Recrutement
      summary: Lister toutes les candidatures pour le tableau Kanban
      description: Accessible à la DRH et aux Managers
      operationId: getAllApplications
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListJobApplicationDto"
  /api/v1/payroll/payslips:
    get:
      tags:
      - Paie & Salaires
      summary: Lister les bulletins de paie par période (YYYY-MM)
      description: Accessible à la DRH uniquement
      operationId: getPayslipsByPeriod
      parameters:
      - name: period
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListPayslipResponseDto"
  /api/v1/payroll/payslips/{id}:
    get:
      tags:
      - Paie & Salaires
      summary: Obtenir le détail d'un bulletin de paie avec toutes les lignes de déduction
      description: Accessible au collaborateur concerné et à la DRH
      operationId: getPayslipById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePayslipResponseDto"
  /api/v1/payroll/payslips/employee/{employeeId}:
    get:
      tags:
      - Paie & Salaires
      summary: Lister l'historique des bulletins d'un collaborateur
      description: Accessible au collaborateur lui-même et à la DRH
      operationId: getPayslipsByEmployee
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListPayslipResponseDto"
  /api/v1/orgchart/tree:
    get:
      tags:
      - Organigramme
      summary: Arbre complet de l'entreprise
      description: Retourne l'organigramme complet depuis la direction générale jusqu'aux
        collaborateurs
      operationId: getCompanyTree
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListOrgNodeDto"
      security:
      - BearerAuth: []
  /api/v1/orgchart/subordinates/{employeeId}:
    get:
      tags:
      - Organigramme
      summary: Sous-arbre hiérarchique
      description: Retourne l'organigramme des subordonnés d'un manager spécifique
      operationId: getSubtree
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrgNodeDto"
      security:
      - BearerAuth: []
  /api/v1/notifications/me:
    get:
      tags:
      - Notifications
      summary: Lister les notifications de l'utilisateur connecté
      description: Accessible à l'utilisateur authentifié
      operationId: getMyNotifications
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListNotificationDto"
  /api/v1/leaves/manager/{managerId}/pending:
    get:
      tags:
      - Congés & Absences
      summary: Demandes en attente pour un manager
      description: Retourne les demandes de congés en attente d'approbation N+1
      operationId: getPendingLeavesForManager
      parameters:
      - name: managerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListLeaveRequestResponseDto"
      security:
      - BearerAuth: []
  /api/v1/leaves/employee/{employeeId}:
    get:
      tags:
      - Congés & Absences
      summary: Historique des demandes d'un employé
      description: Retourne toutes les demandes de congés d'un collaborateur
      operationId: getEmployeeLeaves
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListLeaveRequestResponseDto"
      security:
      - BearerAuth: []
  /api/v1/leaves/conflicts:
    get:
      tags:
      - Congés & Absences
      summary: Détection des conflits de congés d'équipe
      description: Vérifie les chevauchements d'absences dans une même équipe sur
        une période
      operationId: detectConflicts
      parameters:
      - name: departmentId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTeamLeaveConflictDto"
      security:
      - BearerAuth: []
  /api/v1/leaves/balances/{employeeId}:
    get:
      tags:
      - Congés & Absences
      summary: Soldes de congés d'un employé
      description: "Retourne le compteur de jours acquis, utilisés et restants"
      operationId: getBalances
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: year
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 2026
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListLeaveBalanceDto"
      security:
      - BearerAuth: []
  /api/v1/evaluations/{id}:
    get:
      tags:
      - Évaluations & Performance
      summary: Consulter le détail d'une fiche d'évaluation et ses objectifs SMART
      description: "Accessible à l'évaluateur, à l'évalué et à la DRH"
      operationId: getEvaluationById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEvaluationDto"
  /api/v1/evaluations/campaigns/{campaignId}/evaluations:
    get:
      tags:
      - Évaluations & Performance
      summary: Lister les fiches d'évaluation d'une campagne
      description: Accessible aux managers et à la DRH
      operationId: getEvaluationsByCampaign
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListEvaluationDto"
  /api/v1/employees/department/{departmentId}:
    get:
      tags:
      - Employés
      summary: Employés par département
      description: Retourne les employés affectés à un département donné (DRH et Managers)
      operationId: getEmployeesByDepartment
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListEmployeeResponseDto"
      security:
      - BearerAuth: []
  /api/v1/documents/payslip/{payslipId}:
    get:
      tags:
      - Documents & PDF
      summary: Télécharger le bulletin de paie officiel en PDF
      description: Accessible à la DRH et à l'employé concerné uniquement
      operationId: getPayslipPdf
      parameters:
      - name: payslipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
      security:
      - BearerAuth: []
