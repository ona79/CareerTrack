openapi: 3.0.1
info:
  title: CareerTrack API - Plateforme RH
  description: |-
    API REST de gestion des carrières pour PME sénégalaise (Teranga Tech PME SARL (démo))
    - Authentification JWT multi-rôles (DRH, MANAGER, EMPLOYE, DIRECTION)
    - Conforme au Code du Travail sénégalais et calculs en Francs CFA (XOF)
    - Gestion complète du cycle RH : dossier, congés, évaluations, formation, paie, recrutement
  contact:
    name: Équipe Projet CareerTrack
    email: contact@careertrack.sn
  license:
    name: Projet Universitaire - Licence Académique
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Environnement Local Développement
- url: /
  description: Serveur Actuel
security:
- BearerAuth: []
tags:
- name: Employés
  description: "Gestion des dossiers collaborateurs, contrats et fiches de poste"
- name: Paie & Salaires
  description: "Gestion des bulletins de salaire, cotisations et masse salariale"
- name: Postes
  description: Référentiel des postes et fiches de fonction
- name: Évaluations & Performance
  description: "Campagnes annuelles, objectifs SMART et entretiens N+1"
- name: Paramètres de l'Entreprise
  description: "Règles réglementaires, taux de cotisations et plafonds légaux"
- name: Organigramme
  description: Visualisation hiérarchique de l'entreprise et relations managers/subordonnés
- name: Formations
  description: Catalogue des compétences et sessions de formation continue
- name: Recrutement
  description: Pipeline Kanban des candidatures et offres d'emploi
- name: Départements
  description: Référentiel des départements de l'entreprise
- name: Documents & PDF
  description: "Gestion documentaire (envoi, téléchargement, suppression) et géné\
    ration de documents PDF officiels"
- name: Authentification
  description: "Endpoints d'authentification JWT, gestion de session et profil"
- name: Notifications
  description: Alertes in-app et notifications par courrier électronique
- name: Congés & Absences
  description: "Gestion des demandes de congés, soldes et calendrier d'équipe"
- name: Promotions & Carrières
  description: "Propositions de promotion interne, revalorisations et simulations\
    \ salariales"
paths:
  /api/v1/settings/{key}:
    put:
      tags:
      - Paramètres de l'Entreprise
      summary: Mettre à jour la valeur d'un paramètre d'entreprise
      description: Réservé à la DRH
      operationId: updateSetting
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: value
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCompanySettingDto"
  /api/v1/leaves/{id}/validate:
    put:
      tags:
      - Congés & Absences
      summary: Valider ou refuser un congé
      description: Validation N+1 ou DRH avec décompte automatique du solde
      operationId: validateLeave
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveApprovalDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseLeaveRequestResponseDto"
      security:
      - BearerAuth: []
  /api/v1/employees/{id}:
    get:
      tags:
      - Employés
      summary: Détail complet d'un collaborateur
      description: Retourne le dossier modulaire d'un employé selon les autorisations
        du rôle
      operationId: getEmployeeById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEmployeeDetailDto"
      security:
      - BearerAuth: []
    put:
      tags:
      - Employés
      summary: Mettre à jour un employé (DRH)
      description: Modifie l'ensemble du dossier employé avec contrôle de cycle hiérarchique
      operationId: updateEmployee
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdateDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEmployeeDetailDto"
      security:
      - BearerAuth: []
    delete:
      tags:
      - Employés
      summary: Supprimer un employé
      description: Supprime un dossier collaborateur sans dépendances
      operationId: deleteEmployee
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
      security:
      - BearerAuth: []
  /api/v1/trainings:
    get:
      tags:
      - Formations
      summary: Consulter le catalogue de formation
      description: Accessible à l'ensemble des collaborateurs
      operationId: getAllTrainings
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListTrainingDto"
    post:
      tags:
      - Formations
      summary: Ajouter un nouveau module de formation au catalogue
      description: Réservé à la DRH
      operationId: createTraining
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTrainingDto"
  /api/v1/promotions:
    get:
      tags:
      - Promotions & Carrières
      summary: Lister les propositions de promotion
      description: Accessible à la DRH et aux managers
      operationId: getAllProposals
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListPromotionProposalDto"
    post:
      tags:
      - Promotions & Carrières
      summary: Soumettre une proposition de promotion ou revalorisation
      description: Accessible au manager N+1 ou à la DRH
      operationId: createProposal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionProposalDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePromotionProposalDto"
  /api/v1/payroll/generate:
    post:
      tags:
      - Paie & Salaires
      summary: Générer la paie mensuelle globale pour tous les salariés actifs
      description: Calcul automatique des cotisations sociales et retenues fiscales
      operationId: generatePayroll
      parameters:
      - name: period
        in: query
        required: false
        schema:
          type: string
      - name: year
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: month
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePayrollGenerationResultDto"
  /api/v1/leaves:
    get:
      tags:
      - Congés & Absences
      summary: Lister toutes les demandes de congés
      description: Retourne l'ensemble des demandes de congés de l'entreprise
      operationId: getAllLeaves
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListLeaveRequestResponseDto"
      security:
      - BearerAuth: []
    post:
      tags:
      - Congés & Absences
      summary: Soumettre une demande de congé
      description: Crée une nouvelle demande de congé avec vérification du solde
      operationId: createLeaveRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveRequestCreateDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseLeaveRequestResponseDto"
      security:
      - BearerAuth: []
  /api/v1/evaluations/campaigns:
    get:
      tags:
      - Évaluations & Performance
      summary: Lister les campagnes d'évaluations
      description: Accessible à tous les collaborateurs connectés
      operationId: getCampaigns
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListEvaluationCampaignDto"
    post:
      tags:
      - Évaluations & Performance
      summary: Lancer une nouvelle campagne annuelle d'évaluation
      description: Réservé à la DRH
      operationId: createCampaign
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationCampaignDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEvaluationCampaignDto"
  /api/v1/employees:
    get:
      tags:
      - Employés
      summary: Liste paginée des employés (DTO réduit)
      description: "Récupère les employés avec pagination, recherche et filtres (DRH\
        \ et Managers)"
      operationId: getAllEmployees
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: departmentId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - ON_LEAVE
          - PROBATION
          - SUSPENDED
          - TERMINATED
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
          default: lastName
      - name: sortDir
        in: query
        required: false
        schema:
          type: string
          default: asc
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePageResponseEmployeeSummaryDto"
      security:
      - BearerAuth: []
    post:
      tags:
      - Employés
      summary: Créer un employé
      description: Enregistre un nouveau collaborateur dans la plateforme
      operationId: createEmployee
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeCreateDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEmployeeResponseDto"
      security:
      - BearerAuth: []
  /api/v1/documents:
    post:
      tags:
      - Documents & PDF
      summary: Téléverser un document pour un employé
      description: "Accessible à la DRH (tous types) et à l'employé pour lui-même\
        \ (CNI, DIPLOME, AUTRE - hors CONTRAT)"
      operationId: uploadDocument
      parameters:
      - name: employeeId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        required: true
        schema:
          type: string
          enum:
          - CNI
          - PASSEPORT
          - DIPLOME
          - CV
          - CONTRAT
          - ATTESTATION
          - FICHE_PAIE
          - CERTIFICAT_MEDICAL
          - AUTRE
      - name: title
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseDocumentResponseDto"
      security:
      - BearerAuth: []
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentification
      summary: Rafraîchir le token d'accès
      description: Génère un nouvel Access Token à partir d'un Refresh Token valide
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseJwtResponse"
  /api/v1/auth/logout:
    post:
      tags:
      - Authentification
      summary: Déconnexion
      description: Invalide le Refresh Token de session
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/v1/auth/login:
    post:
      tags:
      - Authentification
      summary: Connexion utilisateur
      description: Authentifie l'utilisateur et retourne un Access Token (15m) et
        un Refresh Token (7j)
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseJwtResponse"
  /api/v1/recruitment/applications/{id}/status:
    patch:
      tags:
      - Recrutement
      summary: Déplacer une candidature (Kanban glisser-déposer)
      description: Met à jour l'étape du pipeline et déclenche une notification e-mail
      operationId: updateStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: true
        schema:
          type: string
          enum:
          - RECU
          - PRESELECTIONNE
          - ENTRETIEN
          - OFFRE
          - EMBAUCHE
          - REFUSE
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseJobApplicationDto"
  /api/v1/promotions/{id}/status:
    patch:
      tags:
      - Promotions & Carrières
      summary: Valider ou refuser une proposition de promotion
      description: Réservé à la DRH uniquement
      operationId: updateStatus_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: true
        schema:
          type: string
          enum:
          - SUBMITTED
          - UNDER_REVIEW
          - APPROVED
          - REJECTED
      - name: comment
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePromotionProposalDto"
  /api/v1/payroll/payslips/{id}/status:
    patch:
      tags:
      - Paie & Salaires
      summary: "Modifier le statut d'un bulletin de paie (VALIDATED, PAID, CANCELLED)"
      description: Réservé à la DRH
      operationId: updateStatus_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: true
        schema:
          type: string
          enum:
          - DRAFT
          - GENERATED
          - VALIDATED
          - PAID
          - CANCELLED
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePayslipResponseDto"
  /api/v1/notifications/{id}/read:
    patch:
      tags:
      - Notifications
      summary: Marquer une notification comme lue
      description: Accessible à l'utilisateur connecté
      operationId: markAsRead
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/v1/employees/{id}/deactivate:
    patch:
      tags:
      - Employés
      summary: Désactiver un employé
      description: "Passe le statut à TERMINATED, clôture le contrat actif et désactive\
        \ le compte utilisateur lié"
      operationId: deactivateEmployee
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeDeactivateDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
      security:
      - BearerAuth: []
  /api/v1/employees/{id}/contact:
    patch:
      tags:
      - Employés
      summary: Mise à jour des coordonnées personnelles
      description: Permet à l'employé ou au manager de modifier son propre téléphone
        et son adresse
      operationId: updateSelfContact
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeSelfUpdateDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEmployeeDetailDto"
      security:
      - BearerAuth: []
  /api/v1/trainings/{id}:
    get:
      tags:
      - Formations
      summary: Obtenir le détail d'un module de formation
      description: Accessible à l'ensemble des collaborateurs
      operationId: getTrainingById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTrainingDto"
  /api/v1/settings:
    get:
      tags:
      - Paramètres de l'Entreprise
      summary: Lister les paramètres réglementaires de l'entreprise
      description: Accessible à la DRH et Direction
      operationId: getAllSettings
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListCompanySettingDto"
  /api/v1/recruitment/offers:
    get:
      tags:
      - Recrutement
      summary: Lister les offres d'emploi publiées
      description: Accessible aux utilisateurs authentifiés
      operationId: getOffers
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListJobOffer"
  /api/v1/recruitment/applications:
    get:
      tags:
      - Recrutement
      summary: Lister toutes les candidatures pour le tableau Kanban
      description: Accessible à la DRH et aux Managers
      operationId: getAllApplications
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListJobApplicationDto"
  /api/v1/positions:
    get:
      tags:
      - Postes
      summary: Liste des postes
      description: "Retourne la liste des postes, éventuellement filtrée par département"
      operationId: getPositions
      parameters:
      - name: departmentId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListPositionDto"
      security:
      - BearerAuth: []
  /api/v1/payroll/stats:
    get:
      tags:
      - Paie & Salaires
      summary: Statistiques globales et ventilation de la masse salariale
      description: Accessible à la DRH et à la Direction Générale. Respecte l'anonymat
        (< 3 salariés groupés dans Autres)
      operationId: getPayrollStats
      parameters:
      - name: period
        in: query
        required: false
        schema:
          type: string
      - name: year
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: month
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePayrollStatsResponseDto"
  /api/v1/payroll/payslips:
    get:
      tags:
      - Paie & Salaires
      summary: Lister les bulletins de paie par période (YYYY-MM)
      description: Accessible à la DRH uniquement
      operationId: getPayslipsByPeriod
      parameters:
      - name: period
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListPayslipResponseDto"
  /api/v1/payroll/payslips/{id}:
    get:
      tags:
      - Paie & Salaires
      summary: Obtenir le détail d'un bulletin de paie avec toutes les lignes
      description: Accessible au collaborateur concerné et à la DRH
      operationId: getPayslipById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePayslipResponseDto"
  /api/v1/payroll/payslips/{id}/pdf:
    get:
      tags:
      - Paie & Salaires
      summary: Télécharger le bulletin de paie au format PDF
      description: Accessible à la DRH et au titulaire du bulletin
      operationId: getPayslipPdf
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/pdf:
              schema:
                type: string
                format: byte
  /api/v1/payroll/payslips/employee/{employeeId}:
    get:
      tags:
      - Paie & Salaires
      summary: Lister l'historique des bulletins d'un collaborateur
      description: Accessible au collaborateur lui-même et à la DRH
      operationId: getPayslipsByEmployee
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListPayslipResponseDto"
  /api/v1/payroll/parameters:
    get:
      tags:
      - Paie & Salaires
      summary: Consulter les paramètres légaux et taux de paie en lecture seule
      description: Accessible à la DRH et à la Direction
      operationId: getPayrollParameters
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListPayrollParameterResponseDto"
  /api/v1/payroll/my-payslips:
    get:
      tags:
      - Paie & Salaires
      summary: Lister les bulletins de l'employé connecté
      description: Accessible à tout collaborateur connecté pour consulter ses propres
        bulletins
      operationId: getMyPayslips
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
