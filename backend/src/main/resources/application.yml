spring:
  application:
    name: careertrack-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Format JSON et gestion des dates
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Africa/Dakar
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSZ

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

  # Configuration du service d'envoi d'emails (Recrutement & notifications)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:notifications.careertrack@gmail.com}
    password: ${MAIL_PASSWORD:secret}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Documentation OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    enabled: ${SWAGGER_ENABLED:true}

# Paramètres Métier et Réglementaires CareerTrack (Configurables)
careertrack:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  currency: ${CAREERTRACK_CURRENCY:XOF}
  company-name: ${CAREERTRACK_COMPANY_NAME:Teranga Tech PME SARL (démo)}
  mail:
    from: ${MAIL_FROM:no-reply@careertrack.sn}

  # NOTE IMPORTANTE – RÉGLEMENTATION SOCIALE ET FISCALE SÉNÉGALAISE (Code du Travail, CSS, IPRES, CGI) :
  # 1. RETRAITE (IPRES) :
  #    - Régime Général : Retenue salariale 5,6% / Cotisation patronale 8,4% (Plafond mensuel légal : 432 000 FCFA).
  #    - Régime Cadres (RCC) : Cotisation complémentaire sur tranche supérieure (Plafond mensuel légal : 1 296 000 FCFA).
  # 2. SÉCURITÉ SOCIALE (CSS) :
  #    - Prestations familiales (7%) et Accidents du travail (1% à 5%) : 100% à la charge de l'EMPLOYEUR (salarial = 0%).
  #    - Plafond mensuel d'assiette légale : 63 000 FCFA par salarié.
  # 3. IMPÔT SUR LE REVENU (IR) & TRIMF :
  #    - Le taux fixe provisoire (12%) doit être remplacé dans la version finale par le barème progressif officiel du CGI
  #      (Art. 115 bis et suivants, tranches de 0% à 40% après abattement forfaitaire et quotient familial / nombre de parts).
  #    - La TRIMF (Taxe Représentative de l'Impôt du Minimum Fiscal) varie de 900 à 3 000 FCFA/mois selon la tranche.
  labor-rules:
    monthly-leave-days: ${CAREERTRACK_LEAVE_DAYS_PER_MONTH:2.0}
    max-cdd-months: ${CAREERTRACK_MAX_CDD_MONTHS:24}
    standard-working-hours-per-week: 40
    # Note : Les paramètres de paie (IPRES, CSS, IPM, CFCE, IR, TRIMF) sont désormais
    # gérés dynamiquement avec date d'effet dans les tables payroll_parameters et payroll_tax_brackets.

  jwt:
    secret: ${JWT_SECRET:4c9a63c6218e8d2e8b23c21a4f59e0a9b8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}        # 15 min
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}    # 7 jours
