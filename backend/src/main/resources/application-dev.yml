spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:careertrack_db}
    username: ${DB_USER:careertrack_user}
    password: ${DB_PASSWORD:careertrack_secure_password_2026}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration
      - classpath:db/dev-migration

logging:
  level:
    com.careertrack: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
